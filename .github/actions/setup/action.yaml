name: Install deps
description: Install deps
runs:
  using: composite
  steps:
    - name: Install python system dependencies # https://github.com/pyenv/pyenv/wiki#suggested-build-environment
      shell: bash
      run: >-
        sudo apt update;
        sudo apt install -y build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev curl git libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev;

    - name: Install podman
      shell: bash
      run: |
        if ! command -v podman &> /dev/null; then
          sudo apt install -y podman
        fi
        podman --version

    - name: Install asdf
      uses: asdf-vm/actions/setup@05e0d2ed97b598bfce82fd30daf324ae0c4570e6 # v3.0.2
      with:
        asdf_branch: v0.15.0

    # Molecule creates its test containers with podman. Podman tries the
    # ethpandaops pull-through cache first for Docker Hub images and falls
    # back to Docker Hub.
    - name: Use the Docker Hub pull-through cache
      shell: bash
      run: |
        sudo mkdir -p /etc/containers/registries.conf.d
        sudo tee /etc/containers/registries.conf.d/docker-hub-cache.conf <<'EOF'
        [[registry]]
        prefix = "docker.io"
        location = "docker.io"

        [[registry.mirror]]
        location = "docker-cache.ethquokkaops.io"
        EOF

    - name: Run setup
      shell: bash
      run: make setup
      working-directory: ansible_collections/ethpandaops/general
