- name: Add ethrex user
  ansible.builtin.user:
    name: "{{ ethrex_user }}"
  register: ethrex_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ ethrex_datadir }}"
    state: directory
    mode: "0750"
    owner: "{{ ethrex_user }}"
    group: "{{ ethrex_user }}"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ ethrex_user }}:{{ ethrex_user }} {{ ethrex_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Deploy through upgradoor {{ ethrex_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', ethrex_container_name,
          '--image', ethrex_container_image, '--command',
          (ethrex_container_command + ethrex_container_command_extra_args) | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: ethrex_upgradoor_deploy
  changed_when: ethrex_upgradoor_deploy.stdout is match('{') and (ethrex_upgradoor_deploy.stdout | from_json).changed
  when: ethrex_upgradoor_enabled | bool

- name: Run ethrex container
  vars:
    ethrex_upgradoor: >-
      {{ ethrex_upgradoor_deploy.stdout | from_json
         if ethrex_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ ethrex_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(ethrex_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.kind': 'el'}
         | combine({'io.ethpandaops.upgradoor.team': ethrex_upgradoor_team} if ethrex_upgradoor_team else {})
         if ethrex_upgradoor_enabled | bool else {} }}
    image: "{{ ethrex_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ ethrex_container_stop_timeout }}"
    ports: "{{ ethrex_container_ports }}"
    volumes: "{{ ethrex_container_volumes }}"
    env: "{{ ethrex_container_env }}"
    networks: "{{ ethrex_container_networks }}"
    entrypoint: "{{ ethrex_container_entrypoint | default(omit) }}"
    command: "{{ ethrex_container_command + ethrex_container_command_extra_args }}"
    user: "{{ ethrex_user_meta.uid }}"
    pull: "{{ ethrex_container_pull | bool }}"
    security_opts: "{{ ethrex_container_security_opts }}"
