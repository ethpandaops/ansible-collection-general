             + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
               | mandatory('upgradoor_deploy must be soft, force or immediate') }}
        removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
      register: prysm_validator_upgradoor_deploy
      changed_when: prysm_validator_upgradoor_deploy.stdout is match('{') and (prysm_validator_upgradoor_deploy.stdout | from_json).changed
      when: prysm_upgradoor_enabled | bool

    - name: Run prysm validator container
      vars:
        prysm_validator_upgradoor: >-
          {{ prysm_validator_upgradoor_deploy.stdout | from_json
             if prysm_validator_upgradoor_deploy.stdout | default('') is match('{') else {} }}
      community.docker.docker_container:
        name: "{{ prysm_validator_container_name }}"
        comparisons: >-
          {{ {} if upgradoor_deploy | default('soft') == 'immediate'
             else dict(prysm_validator_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
        labels: >-
          {{ {'io.ethpandaops.upgradoor.kind': 'vc'}
             | combine({'io.ethpandaops.upgradoor.team': prysm_validator_upgradoor_team} if prysm_validator_upgradoor_team else {})
             if prysm_upgradoor_enabled | bool else {} }}
        image: "{{ prysm_validator_container_image }}"
        image_name_mismatch: recreate
        state: started
        restart_policy: always
        stop_timeout: "{{ prysm_validator_container_stop_timeout }}"
        ports: "{{ prysm_validator_container_ports }}"
        volumes: "{{ prysm_validator_container_volumes }}"
        env: "{{ prysm_validator_container_env }}"
        networks: "{{ prysm_validator_container_networks }}"
        tty: "{{ prysm_validator_container_tty }}"
        entrypoint: "{{ prysm_validator_container_entrypoint | default(omit) }}"
        command: >-
          {{
            prysm_validator_container_command +
            prysm_validator_container_command_extra_args +
            (prysm_mev_boost_enabled | ternary(prysm_mev_boost_validator_command, []))
          }}
        user: "{{ prysm_user_meta.uid }}"
        pull: "{{ prysm_container_pull | bool }}"
        security_opts: "{{ prysm_validator_container_security_opts }}"
        memory: "{{ prysm_validator_container_memory | default(omit) }}"
        memory_reservation: "{{ prysm_validator_container_memory_reservation | default(omit) }}"
        memory_swap: "{{ prysm_validator_container_memory_swap | default(omit) }}"
        memory_swappiness: "{{ prysm_validator_container_memory_swappiness | default(omit) }}"
        kernel_memory: "{{ prysm_validator_container_kernel_memory | default(omit) }}"
        cpus: "{{ prysm_validator_container_cpus | default(omit) }}"
        cpuset_cpus: "{{ prysm_validator_container_cpuset_cpus | default(omit) }}"
        cpuset_mems: "{{ prysm_validator_container_cpuset_mems | default(omit) }}"
        cpu_shares: "{{ prysm_validator_container_cpu_shares | default(omit) }}"
        cpu_quota: "{{ prysm_validator_container_cpu_quota | default(omit) }}"
        cpu_period: "{{ prysm_validator_container_cpu_period | default(omit) }}"
