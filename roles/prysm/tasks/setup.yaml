- name: Add prysm user
  ansible.builtin.user:
    name: "{{ prysm_user }}"
  register: prysm_user_meta

- name: Configure prysm beacon client
  when: prysm_enabled
  block:
    - name: Create data dir
      ansible.builtin.file:
        path: "{{ prysm_datadir }}"
        state: directory
        mode: "0750"
        owner: "{{ prysm_user }}"
        group: "{{ prysm_user }}"

    - name: Set permissions
      ansible.builtin.command: "chown -R {{ prysm_user }}:{{ prysm_user }} {{ prysm_datadir }}" # noqa no-free-form
      failed_when: false
      changed_when: false

    - name: Deploy through upgradoor {{ prysm_container_name }}
      ansible.builtin.command:
        argv: >-
          {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', prysm_container_name,
              '--image', prysm_container_image, '--command',
              (prysm_container_command +
               prysm_container_command_extra_args +
               (prysm_checkpoint_sync_enabled | ternary(prysm_container_command_checkpoint_args, [])) +
               (prysm_mev_boost_enabled | ternary(prysm_mev_boost_beacon_command, []))) | to_json]
             + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
               | mandatory('upgradoor_deploy must be soft, force or immediate') }}
        removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
      register: prysm_upgradoor_deploy
      changed_when: prysm_upgradoor_deploy.stdout is match('{') and (prysm_upgradoor_deploy.stdout | from_json).changed
      when: prysm_upgradoor_enabled | bool

    - name: Run prysm container
      vars:
        prysm_upgradoor: >-
          {{ prysm_upgradoor_deploy.stdout | from_json
             if prysm_upgradoor_deploy.stdout | default('') is match('{') else {} }}
      community.docker.docker_container:
        name: "{{ prysm_container_name }}"
        comparisons: >-
          {{ {} if upgradoor_deploy | default('soft') == 'immediate'
             else dict(prysm_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
        labels: >-
          {{ {'io.ethpandaops.upgradoor.kind': 'cl'}
             | combine({'io.ethpandaops.upgradoor.team': prysm_upgradoor_team} if prysm_upgradoor_team else {})
             if prysm_upgradoor_enabled | bool else {} }}
        image: "{{ prysm_container_image }}"
        image_name_mismatch: recreate
        state: started
        restart_policy: always
        stop_timeout: "{{ prysm_container_stop_timeout }}"
        ports: "{{ prysm_container_ports }}"
        volumes: "{{ prysm_container_volumes }}"
        env: "{{ prysm_container_env }}"
        networks: "{{ prysm_container_networks }}"
        tty: "{{ prysm_container_tty }}"
        entrypoint: "{{ prysm_container_entrypoint | default(omit) }}"
        command: >-
          {{
            prysm_container_command +
            prysm_container_command_extra_args +
            (prysm_checkpoint_sync_enabled | ternary(prysm_container_command_checkpoint_args, [])) +
            (prysm_mev_boost_enabled | ternary(prysm_mev_boost_beacon_command, []))
          }}
        user: "{{ prysm_user_meta.uid }}"
        pull: "{{ prysm_container_pull | bool }}"
        security_opts: "{{ prysm_container_security_opts }}"
        memory: "{{ prysm_container_memory | default(omit) }}"
        memory_reservation: "{{ prysm_container_memory_reservation | default(omit) }}"
        memory_swap: "{{ prysm_container_memory_swap | default(omit) }}"
        memory_swappiness: "{{ prysm_container_memory_swappiness | default(omit) }}"
        kernel_memory: "{{ prysm_container_kernel_memory | default(omit) }}"
        cpus: "{{ prysm_container_cpus | default(omit) }}"
        cpuset_cpus: "{{ prysm_container_cpuset_cpus | default(omit) }}"
        cpuset_mems: "{{ prysm_container_cpuset_mems | default(omit) }}"
        cpu_shares: "{{ prysm_container_cpu_shares | default(omit) }}"
        cpu_quota: "{{ prysm_container_cpu_quota | default(omit) }}"
        cpu_period: "{{ prysm_container_cpu_period | default(omit) }}"


- name: Configure prysm beacon client
  when: prysm_validator_enabled
  block:
    - name: Create validator data dir
      ansible.builtin.file:
        path: "{{ prysm_validator_datadir }}"
        state: directory
        mode: "0750"
        owner: "{{ prysm_user }}"
        group: "{{ prysm_user }}"

    - name: Set permissions for validator data dir
      ansible.builtin.command: "chown -R {{ prysm_user }}:{{ prysm_user }} {{ prysm_validator_datadir }}" # noqa no-free-form
      failed_when: false
      changed_when: false

    - name: Deploy through upgradoor {{ prysm_validator_container_name }}
      ansible.builtin.command:
        argv: >-
          {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', prysm_validator_container_name,
              '--image', prysm_validator_container_image, '--command',
              (prysm_validator_container_command +
               prysm_validator_container_command_extra_args +
