teku_enabled: true
teku_user: teku
teku_datadir: /data/teku
teku_auth_jwt_path: /data/execution-auth.secret
teku_execution_engine_endpoint: http://geth:8551
teku_beacon_endpoint: "http://{{ teku_container_name }}:{{ teku_ports_http_beacon }}"
teku_announced_ip: "{{ ansible_host }}"
teku_public_ipv6: ""
teku_announced_ipv6: >-
  {{ teku_public_ipv6 if (teku_public_ipv6 | length > 0)
  else (ansible_default_ipv6.address
  if teku_ipv6_enabled and ansible_default_ipv6.address is defined else '') }}
teku_mev_boost_endpoint: "http://mev-boost:18550"

teku_cleanup: false # when set to "true" it will remove the container

teku_ports_p2p_tcp: 9000
teku_ports_p2p_udp: 9000
teku_ports_quic: 9001
teku_ports_http_beacon: 5051
teku_ports_metrics: 8008

teku_ipv6_enabled: false
teku_supernode_enabled: false

teku_validator_enabled: false
teku_validator_fee_recipient: "0x25941dC771bB64514Fc8abBce970307Fb9d477e9" # theprotocolguild.eth
teku_validator_datadir: /data/teku-validator

################################################################################
##
## Beacon node container configuration
##
################################################################################
teku_container_name: teku
teku_container_image: consensys/teku:latest
teku_container_env: {}
# teku_container_entrypoint:
teku_container_ports_ipv4:
  - "127.0.0.1:{{ teku_ports_http_beacon }}:{{ teku_ports_http_beacon }}"
  - "127.0.0.1:{{ teku_ports_metrics }}:{{ teku_ports_metrics }}"
  - "0.0.0.0:{{ teku_ports_p2p_tcp }}:{{ teku_ports_p2p_tcp }}"
  - "0.0.0.0:{{ teku_ports_p2p_udp }}:{{ teku_ports_p2p_udp }}/udp"
  - "0.0.0.0:{{ teku_ports_quic }}:{{ teku_ports_quic }}/udp"

teku_container_ports_ipv6:
  - "[::]:{{ teku_ports_p2p_tcp }}:{{ teku_ports_p2p_tcp }}"
  - "[::]:{{ teku_ports_p2p_udp }}:{{ teku_ports_p2p_udp }}/udp"
  - "[::]:{{ teku_ports_quic }}:{{ teku_ports_quic }}/udp"

teku_container_ports: >-
  {{ teku_container_ports_ipv4 +
  (teku_container_ports_ipv6
  if teku_ipv6_enabled and ansible_default_ipv6.address is defined
  and (teku_public_ipv6 | length == 0) else []) }}

teku_container_volumes:
  - "{{ teku_datadir }}:/data"
  - "{{ teku_auth_jwt_path }}:/execution-auth.jwt:ro"
teku_container_security_opts: []
# teku_container_memory:
# teku_container_memory_reservation:
# teku_container_memory_swap:
# teku_container_memory_swappiness:
# teku_container_kernel_memory:
# teku_container_cpus:
# teku_container_cpuset_cpus:
# teku_container_cpuset_mems:
# teku_container_cpu_shares:
# teku_container_cpu_quota:
# teku_container_cpu_period:
teku_container_stop_timeout: "300"
teku_container_networks: []
teku_container_command_default:
  - --data-path=/data
  - --log-destination=CONSOLE
  - --p2p-enabled=true
  - --p2p-interface=0.0.0.0
  - --p2p-advertised-ip={{ teku_announced_ip }}
  - --p2p-port={{ teku_ports_p2p_tcp }}
  - --p2p-advertised-port={{ teku_ports_p2p_udp }}
  - --rest-api-enabled
  - --rest-api-interface=0.0.0.0
  - --rest-api-port={{ teku_ports_http_beacon }}
  - --rest-api-host-allowlist=*
  - --ee-endpoint={{ teku_execution_engine_endpoint }}
  - --ee-jwt-secret-file=/execution-auth.jwt

teku_container_command_metrics:
  - --metrics-enabled=true
  - --metrics-interface=0.0.0.0
  - --metrics-port={{ teku_ports_metrics }}
  - --metrics-host-allowlist=*

teku_container_command_v6: []
# - --p2p-advertised-ipv6={{ teku_announced_ipv6 }} # not supported yet

teku_container_supernode_command:
  - --p2p-subscribe-all-custody-subnets-enabled

teku_container_command: >-
  {{
    teku_container_command_default +
    teku_container_command_metrics +
    (teku_container_command_v6 if teku_ipv6_enabled and ansible_default_ipv6.address is defined else []) +
    (teku_container_supernode_command if teku_supernode_enabled else [])
  }}

teku_container_command_extra_args:
  - --data-storage-mode=PRUNE
# - --network=mainnet
# - --logging=INFO
# - ---validators-graffiti=hello-world

checkpoint_sync_url: https://beaconstate.ethstaker.cc # noqa var-naming[no-role-prefix]
teku_checkpoint_sync_enabled: true
teku_container_command_checkpoint_args:
  - --checkpoint-sync-url={{ checkpoint_sync_url }}
teku_container_command_all: >-
  {{
    teku_container_command +
    teku_container_command_extra_args +
    (teku_validator_enabled | ternary(teku_validator_container_args, [])) +
    (teku_checkpoint_sync_enabled | ternary(teku_container_command_checkpoint_args, [])) +
    (teku_mev_boost_enabled | ternary(teku_mev_boost_beacon_command, []))
  }}

################################################################################
##
## Validator specific configuration
##
################################################################################
teku_validator_container_image: "{{ teku_container_image }}"
teku_validator_container_name: "{{ teku_container_name }}-validator"
teku_validator_container_args:
  - --validator-keys=/validator-data/keys:/validator-data/secrets
  - --validators-proposer-default-fee-recipient={{ teku_validator_fee_recipient }}
  - --validators-keystore-locking-enabled=false
teku_validator_container_volumes:
  - "{{ teku_validator_datadir }}:/validator-data"
teku_validator_container_command: >-
  {{
    [
      "validator-client",
      "--beacon-node-api-endpoint=" + teku_beacon_endpoint,
      "--data-path=/validator-data"
    ] +
    teku_validator_container_args +
    teku_container_command_metrics +
    teku_container_command_extra_args
  }}

# Default image pull policy
teku_container_pull: false

################################################################################
##
## MEV Boost configuration
##
################################################################################
teku_mev_boost_enabled: false
teku_mev_boost_beacon_command:
  - --validators-builder-registration-default-enabled=true
  - --builder-endpoint={{ teku_mev_boost_endpoint }}

################################################################################
##
## upgradoor
##
################################################################################
teku_upgradoor_enabled: "{{ upgradoor_enabled | default(false) }}"
teku_upgradoor_team: teku
teku_validator_upgradoor_team: "{{ teku_upgradoor_team }}"
teku_upgradoor_result: >-
  {{ teku_upgradoor_deploy.stdout | from_json
     if (teku_upgradoor_deploy.stdout | default('')) is match('{') else {} }}
teku_upgradoor_deploy_argv: >-
  {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', teku_container_name,
      '--image', teku_container_image, '--command', teku_container_command_all | to_json]
     + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
       | mandatory('upgradoor_deploy must be soft, force or immediate') }}
teku_upgradoor_labels: >-
  {{ {'io.ethpandaops.upgradoor.kind': 'cl'}
     | combine({'io.ethpandaops.upgradoor.team': teku_upgradoor_team} if teku_upgradoor_team else {})
     if teku_upgradoor_enabled | bool else {} }}
teku_upgradoor_comparisons: >-
  {{ {} if upgradoor_deploy | default('soft') == 'immediate'
     else dict(teku_upgradoor_result.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
teku_upgradoor_pull: >-
  {{ upgradoor_deploy | default('soft') == 'immediate'
     or (teku_upgradoor_result.pull | default(teku_container_pull | bool)) }}
teku_validator_upgradoor_result: >-
  {{ teku_validator_upgradoor_deploy.stdout | from_json
     if (teku_validator_upgradoor_deploy.stdout | default('')) is match('{') else {} }}
teku_validator_upgradoor_deploy_argv: >-
  {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', teku_validator_container_name,
      '--image', teku_validator_container_image, '--command', teku_validator_container_command | to_json]
     + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
       | mandatory('upgradoor_deploy must be soft, force or immediate') }}
teku_validator_upgradoor_labels: >-
  {{ {'io.ethpandaops.upgradoor.kind': 'vc'}
     | combine({'io.ethpandaops.upgradoor.team': teku_validator_upgradoor_team} if teku_validator_upgradoor_team else {})
     if teku_upgradoor_enabled | bool else {} }}
teku_validator_upgradoor_comparisons: >-
  {{ {} if upgradoor_deploy | default('soft') == 'immediate'
     else dict(teku_validator_upgradoor_result.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
teku_validator_upgradoor_pull: >-
  {{ upgradoor_deploy | default('soft') == 'immediate'
     or (teku_validator_upgradoor_result.pull | default(teku_container_pull | bool)) }}
