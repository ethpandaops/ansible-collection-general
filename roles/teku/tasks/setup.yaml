- name: Add teku user
  ansible.builtin.user:
    name: "{{ teku_user }}"
  register: teku_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ teku_datadir }}"
    state: directory
    mode: "0750"
    owner: "{{ teku_user }}"
    group: "{{ teku_user }}"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ teku_user }}:{{ teku_user }} {{ teku_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Create validator data dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ teku_user }}"
    group: "{{ teku_user }}"
  loop:
    - "{{ teku_validator_datadir }}"
    - "{{ teku_validator_datadir }}/keys"
    - "{{ teku_validator_datadir }}/secrets"
  when: teku_validator_enabled

- name: Set permissions for validator data dir
  ansible.builtin.command: "chown -R {{ teku_user }}:{{ teku_user }} {{ teku_validator_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false
  when: teku_validator_enabled

- name: Deploy through upgradoor {{ teku_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', teku_container_name,
          '--image', teku_container_image, '--command',
          (teku_container_command +
           teku_container_command_extra_args +
           (teku_validator_enabled | ternary(teku_validator_container_args, [])) +
           (teku_checkpoint_sync_enabled | ternary(teku_container_command_checkpoint_args, [])) +
           (teku_mev_boost_enabled | ternary(teku_mev_boost_beacon_command, []))) | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: teku_upgradoor_deploy
  changed_when: teku_upgradoor_deploy.stdout is match('{') and (teku_upgradoor_deploy.stdout | from_json).changed
  when:
    - teku_enabled
    - secret_upgradoor_seed is defined

- name: Run teku container
  when: teku_enabled
  vars:
    teku_upgradoor: >-
      {{ teku_upgradoor_deploy.stdout | from_json
         if teku_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ teku_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(teku_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.group': teku_upgradoor_group, 'io.ethpandaops.upgradoor.kind': 'cl'}
         if teku_upgradoor and teku_upgradoor_group else {} }}
    image: "{{ teku_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ teku_container_stop_timeout }}"
    ports: "{{ teku_container_ports }}"
    volumes: "{{ teku_container_volumes + (teku_validator_enabled | ternary(teku_validator_container_volumes, [])) }}"
    env: "{{ teku_container_env }}"
    networks: "{{ teku_container_networks }}"
    entrypoint: "{{ teku_container_entrypoint | default(omit) }}"
    command: >-
      {{
        teku_container_command +
        teku_container_command_extra_args +
        (teku_validator_enabled | ternary(teku_validator_container_args, [])) +
        (teku_checkpoint_sync_enabled | ternary(teku_container_command_checkpoint_args, [])) +
        (teku_mev_boost_enabled | ternary(teku_mev_boost_beacon_command, []))
      }}
    user: "{{ teku_user_meta.uid }}"
    pull: "{{ teku_container_pull | bool }}"
    security_opts: "{{ teku_container_security_opts }}"
    memory: "{{ teku_container_memory | default(omit) }}"
    memory_reservation: "{{ teku_container_memory_reservation | default(omit) }}"
    memory_swap: "{{ teku_container_memory_swap | default(omit) }}"
    memory_swappiness: "{{ teku_container_memory_swappiness | default(omit) }}"
    kernel_memory: "{{ teku_container_kernel_memory | default(omit) }}"
    cpus: "{{ teku_container_cpus | default(omit) }}"
    cpuset_cpus: "{{ teku_container_cpuset_cpus | default(omit) }}"
    cpuset_mems: "{{ teku_container_cpuset_mems | default(omit) }}"
    cpu_shares: "{{ teku_container_cpu_shares | default(omit) }}"
    cpu_quota: "{{ teku_container_cpu_quota | default(omit) }}"
    cpu_period: "{{ teku_container_cpu_period | default(omit) }}"

- name: Run teku validator container
  when: teku_validator_enabled and (not teku_enabled)
  community.docker.docker_container:
    name: "{{ teku_validator_container_name }}"
    image: "{{ teku_validator_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ teku_container_stop_timeout }}"
    ports: []
    volumes: "{{ teku_validator_container_volumes }}"
    env: "{{ teku_container_env }}"
    networks: "{{ teku_container_networks }}"
    entrypoint: "{{ teku_container_entrypoint | default(omit) }}"
    command: "{{ teku_validator_container_command }}"
    user: "{{ teku_user_meta.uid }}"
    pull: "{{ teku_container_pull | bool }}"
    security_opts: "{{ teku_container_security_opts }}"
