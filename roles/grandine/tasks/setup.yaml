- name: Add grandine user
  ansible.builtin.user:
    name: "{{ grandine_user }}"
  register: grandine_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ grandine_datadir }}"
    state: directory
    mode: "0750"
    owner: "{{ grandine_user }}"
    group: "{{ grandine_user }}"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ grandine_user }}:{{ grandine_user }} {{ grandine_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Create validator data dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ grandine_user }}"
    group: "{{ grandine_user }}"
  loop:
    - "{{ grandine_validator_datadir }}"
    - "{{ grandine_validator_datadir }}/keys"
    - "{{ grandine_validator_datadir }}/secrets"
  when: grandine_validator_enabled

- name: Set permissions for validator data dir
  ansible.builtin.command: "chown -R {{ grandine_user }}:{{ grandine_user }} {{ grandine_validator_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false
  when: grandine_validator_enabled

- name: Deploy through upgradoor {{ grandine_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', grandine_container_name,
          '--image', grandine_container_image, '--command',
          (grandine_container_command +
           (grandine_validator_enabled | ternary(grandine_container_validator_args +
             (grandine_mev_boost_enabled | ternary(grandine_mev_boost_beacon_command,[])),
           [])) +
           (grandine_checkpoint_sync_enabled | ternary(
             grandine_container_command_extra_args + grandine_container_command_checkpoint_args,
             grandine_container_command_extra_args
           ))) | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: grandine_upgradoor_deploy
  changed_when: grandine_upgradoor_deploy.stdout is match('{') and (grandine_upgradoor_deploy.stdout | from_json).changed
  when: grandine_upgradoor_enabled | bool

- name: Run grandine container
  vars:
    grandine_upgradoor: >-
      {{ grandine_upgradoor_deploy.stdout | from_json
         if grandine_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ grandine_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(grandine_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.kind': 'cl'}
         | combine({'io.ethpandaops.upgradoor.team': grandine_upgradoor_team} if grandine_upgradoor_team else {})
         if grandine_upgradoor_enabled | bool else {} }}
    image: "{{ grandine_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ grandine_container_stop_timeout }}"
    ports: "{{ grandine_container_ports }}"
    volumes: "{{ grandine_container_volumes + (grandine_validator_enabled | ternary(grandine_container_validator_volumes, [])) }}"
    env: "{{ grandine_container_env }}"
    networks: "{{ grandine_container_networks }}"
    entrypoint: "{{ grandine_container_entrypoint | default(omit) }}"
    command: >-
      {{
        grandine_container_command +
        (grandine_validator_enabled | ternary(grandine_container_validator_args +
          (grandine_mev_boost_enabled | ternary(grandine_mev_boost_beacon_command,[])),
        [])) +
        (grandine_checkpoint_sync_enabled | ternary(
          grandine_container_command_extra_args + grandine_container_command_checkpoint_args,
          grandine_container_command_extra_args
        ))
      }}
    user: "{{ grandine_user_meta.uid }}"
    pull: "{{ grandine_container_pull | bool }}"
    security_opts: "{{ grandine_container_security_opts }}"
    memory: "{{ grandine_container_memory | default(omit) }}"
    memory_reservation: "{{ grandine_container_memory_reservation | default(omit) }}"
    memory_swap: "{{ grandine_container_memory_swap | default(omit) }}"
    memory_swappiness: "{{ grandine_container_memory_swappiness | default(omit) }}"
    kernel_memory: "{{ grandine_container_kernel_memory | default(omit) }}"
    cpus: "{{ grandine_container_cpus | default(omit) }}"
    cpuset_cpus: "{{ grandine_container_cpuset_cpus | default(omit) }}"
    cpuset_mems: "{{ grandine_container_cpuset_mems | default(omit) }}"
    cpu_shares: "{{ grandine_container_cpu_shares | default(omit) }}"
    cpu_quota: "{{ grandine_container_cpu_quota | default(omit) }}"
    cpu_period: "{{ grandine_container_cpu_period | default(omit) }}"
