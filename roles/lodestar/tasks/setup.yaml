- name: Add lodestar user
  ansible.builtin.user:
    name: "{{ lodestar_user }}"
  register: lodestar_user_meta

- name: Configure lodestar beacon client
  when: lodestar_enabled
  block:
    - name: Create data dir
      ansible.builtin.file:
        path: "{{ lodestar_datadir }}"
        state: directory
        mode: "0750"
        owner: "{{ lodestar_user }}"
        group: "{{ lodestar_user }}"

    - name: Set permissions
      ansible.builtin.command: "chown -R {{ lodestar_user }}:{{ lodestar_user }} {{ lodestar_datadir }}" # noqa no-free-form
      failed_when: false
      changed_when: false

    - name: Deploy through upgradoor {{ lodestar_container_name }}
      ansible.builtin.command:
        argv: >-
          {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', lodestar_container_name,
              '--image', lodestar_container_image, '--command',
              (lodestar_container_command +
               lodestar_container_command_extra_args +
               (lodestar_checkpoint_sync_enabled | ternary(lodestar_container_command_checkpoint_args, [])) +
               (lodestar_mev_boost_enabled | ternary(lodestar_mev_boost_beacon_command, []))) | to_json]
             + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
               | mandatory('upgradoor_deploy must be soft, force or immediate') }}
        removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
      register: lodestar_upgradoor_deploy
      changed_when: lodestar_upgradoor_deploy.stdout is match('{') and (lodestar_upgradoor_deploy.stdout | from_json).changed
      when: lodestar_upgradoor_enabled | bool

    - name: Run lodestar container
      vars:
        lodestar_upgradoor: >-
          {{ lodestar_upgradoor_deploy.stdout | from_json
             if lodestar_upgradoor_deploy.stdout | default('') is match('{') else {} }}
      community.docker.docker_container:
        name: "{{ lodestar_container_name }}"
        comparisons: >-
          {{ {} if upgradoor_deploy | default('soft') == 'immediate'
             else dict(lodestar_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
        labels: >-
          {{ {'io.ethpandaops.upgradoor.kind': 'cl'}
             | combine({'io.ethpandaops.upgradoor.team': lodestar_upgradoor_team} if lodestar_upgradoor_team else {})
             if lodestar_upgradoor_enabled | bool else {} }}
        image: "{{ lodestar_container_image }}"
        image_name_mismatch: recreate
        state: started
        restart_policy: always
        stop_timeout: "{{ lodestar_container_stop_timeout }}"
        ports: "{{ lodestar_container_ports }}"
        volumes: "{{ lodestar_container_volumes }}"
        env: "{{ lodestar_container_env }}"
        networks: "{{ lodestar_container_networks }}"
        entrypoint: "{{ lodestar_container_entrypoint | default(omit) }}"
        command: >-
          {{
            lodestar_container_command +
            lodestar_container_command_extra_args +
            (lodestar_checkpoint_sync_enabled | ternary(lodestar_container_command_checkpoint_args, [])) +
            (lodestar_mev_boost_enabled | ternary(lodestar_mev_boost_beacon_command, []))
          }}
        user: "{{ lodestar_user_meta.uid }}"
        pull: "{{ lodestar_container_pull | bool }}"
        security_opts: "{{ lodestar_container_security_opts }}"
        memory: "{{ lodestar_container_memory | default(omit) }}"
        memory_reservation: "{{ lodestar_container_memory_reservation | default(omit) }}"
        memory_swap: "{{ lodestar_container_memory_swap | default(omit) }}"
        memory_swappiness: "{{ lodestar_container_memory_swappiness | default(omit) }}"
        kernel_memory: "{{ lodestar_container_kernel_memory | default(omit) }}"
        cpus: "{{ lodestar_container_cpus | default(omit) }}"
        cpuset_cpus: "{{ lodestar_container_cpuset_cpus | default(omit) }}"
        cpuset_mems: "{{ lodestar_container_cpuset_mems | default(omit) }}"
        cpu_shares: "{{ lodestar_container_cpu_shares | default(omit) }}"
        cpu_quota: "{{ lodestar_container_cpu_quota | default(omit) }}"
        cpu_period: "{{ lodestar_container_cpu_period | default(omit) }}"


- name: Configure lodestar validator client
  when: lodestar_validator_enabled
  block:
    - name: Create validator data dir
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
        owner: "{{ lodestar_user }}"
        group: "{{ lodestar_user }}"
      loop:
        - "{{ lodestar_validator_datadir }}"
        - "{{ lodestar_validator_datadir }}/keys"
        - "{{ lodestar_validator_datadir }}/secrets"

    - name: Set permissions for validator data dir
      ansible.builtin.command: "chown -R {{ lodestar_user }}:{{ lodestar_user }} {{ lodestar_validator_datadir }}" # noqa no-free-form
      failed_when: false
      changed_when: false

    - name: Deploy through upgradoor {{ lodestar_validator_container_name }}
      ansible.builtin.command:
        argv: >-
          {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', lodestar_validator_container_name,
              '--image', lodestar_validator_container_image, '--command',
              (lodestar_validator_container_command +
               lodestar_validator_container_command_extra_args +
               (lodestar_mev_boost_enabled | ternary(lodestar_mev_boost_validator_command, []))) | to_json]
             + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
               | mandatory('upgradoor_deploy must be soft, force or immediate') }}
        removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
      register: lodestar_validator_upgradoor_deploy
      changed_when: lodestar_validator_upgradoor_deploy.stdout is match('{') and (lodestar_validator_upgradoor_deploy.stdout | from_json).changed
      when: lodestar_upgradoor_enabled | bool

    - name: Run lodestar validator container
      vars:
        lodestar_validator_upgradoor: >-
          {{ lodestar_validator_upgradoor_deploy.stdout | from_json
             if lodestar_validator_upgradoor_deploy.stdout | default('') is match('{') else {} }}
      community.docker.docker_container:
        name: "{{ lodestar_validator_container_name }}"
        comparisons: >-
          {{ {} if upgradoor_deploy | default('soft') == 'immediate'
             else dict(lodestar_validator_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
        labels: >-
          {{ {'io.ethpandaops.upgradoor.kind': 'vc'}
             | combine({'io.ethpandaops.upgradoor.team': lodestar_validator_upgradoor_team} if lodestar_validator_upgradoor_team else {})
             if lodestar_upgradoor_enabled | bool else {} }}
        image: "{{ lodestar_validator_container_image }}"
        image_name_mismatch: recreate
        state: started
        restart_policy: always
        stop_timeout: "{{ lodestar_validator_container_stop_timeout }}"
        ports: "{{ lodestar_validator_container_ports }}"
        volumes: "{{ lodestar_validator_container_volumes }}"
        env: "{{ lodestar_validator_container_env }}"
        networks: "{{ lodestar_validator_container_networks }}"
        entrypoint: "{{ lodestar_validator_container_entrypoint | default(omit) }}"
        command: >-
          {{
            lodestar_validator_container_command +
            lodestar_validator_container_command_extra_args +
            (lodestar_mev_boost_enabled | ternary(lodestar_mev_boost_validator_command, []))
          }}
        user: "{{ lodestar_user_meta.uid }}"
        pull: "{{ lodestar_container_pull | bool }}"
        security_opts: "{{ lodestar_validator_container_security_opts }}"
        memory: "{{ lodestar_validator_container_memory | default(omit) }}"
        memory_reservation: "{{ lodestar_validator_container_memory_reservation | default(omit) }}"
        memory_swap: "{{ lodestar_validator_container_memory_swap | default(omit) }}"
        memory_swappiness: "{{ lodestar_validator_container_memory_swappiness | default(omit) }}"
        kernel_memory: "{{ lodestar_validator_container_kernel_memory | default(omit) }}"
        cpus: "{{ lodestar_validator_container_cpus | default(omit) }}"
        cpuset_cpus: "{{ lodestar_validator_container_cpuset_cpus | default(omit) }}"
        cpuset_mems: "{{ lodestar_validator_container_cpuset_mems | default(omit) }}"
        cpu_shares: "{{ lodestar_validator_container_cpu_shares | default(omit) }}"
        cpu_quota: "{{ lodestar_validator_container_cpu_quota | default(omit) }}"
        cpu_period: "{{ lodestar_validator_container_cpu_period | default(omit) }}"
