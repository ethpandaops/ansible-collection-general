- name: Validate required buildoor configuration
  ansible.builtin.assert:
    that:
      - (buildoor_builder_privkey | length > 0) or (buildoor_builder_mnemonic | length > 0)
      - buildoor_wallet_privkey | length > 0
      - buildoor_cl_client | length > 0
      - buildoor_el_engine_api | length > 0
      - buildoor_el_rpc | length > 0
      - buildoor_jwt_path | length > 0
    fail_msg: >-
      buildoor requires a builder key (buildoor_builder_privkey or
      buildoor_builder_mnemonic), a wallet key, CL/EL endpoints and a JWT secret
      path to be configured.

- name: Refuse to deploy buildoor without authentication
  ansible.builtin.assert:
    that:
      - (buildoor_auth_provider_url | length > 0) or (buildoor_allow_unauthenticated | bool)
    fail_msg: >-
      buildoor_auth_provider_url is empty, which serves the whole buildoor API
      (settings, key lifecycle, pprof) without authentication. Set
      buildoor_auth_provider_url, or set buildoor_allow_unauthenticated=true if
      the API is not reachable from untrusted networks.

- name: Add buildoor user
  ansible.builtin.user:
    name: "{{ buildoor_user }}"
  register: buildoor_user_meta

- name: Setup docker network
  ansible.builtin.include_role:
    name: ethpandaops.general.docker_network
  vars:
    docker_network_name: "{{ buildoor_docker_network_name }}"

- name: Create buildoor data directory
  ansible.builtin.file:
    path: "{{ buildoor_datadir }}"
    state: directory
    owner: "{{ buildoor_user }}"
    group: "{{ buildoor_user }}"
    mode: '0750'

- name: Write buildoor secrets file
  ansible.builtin.copy:
    content: "{{ buildoor_secrets | to_nice_yaml }}"
    dest: "{{ buildoor_secrets_file }}"
    owner: "{{ buildoor_user }}"
    group: "{{ buildoor_user }}"
    mode: '0600'
  no_log: true
  notify: Restart buildoor container

- name: Run buildoor container
  community.docker.docker_container:
    name: "{{ buildoor_container_name }}"
    image: "{{ buildoor_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ buildoor_container_stop_timeout }}"
    volumes: "{{ buildoor_container_volumes }}"
    env: "{{ buildoor_container_env }}"
    networks: "{{ buildoor_container_networks }}"
    ports: "{{ buildoor_container_ports }}"
    command: "{{ (buildoor_container_command + buildoor_container_command_extra_args) | flatten }}"
    user: "{{ buildoor_user_meta.uid }}"
    pull: "{{ buildoor_container_pull | bool }}"
