- name: Add nimbus user
  ansible.builtin.user:
    name: "{{ nimbus_user }}"
  register: nimbus_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ nimbus_datadir }}"
    state: directory
    mode: "0700"
    owner: "{{ nimbus_user }}"
    group: "{{ nimbus_user }}"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ nimbus_user }}:{{ nimbus_user }} {{ nimbus_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Create validator data dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ nimbus_user }}"
    group: "{{ nimbus_user }}"
  loop:
    - "{{ nimbus_validator_datadir }}"
    - "{{ nimbus_validator_datadir }}/keys"
    - "{{ nimbus_validator_datadir }}/secrets"
  when: nimbus_validator_enabled

- name: Set permissions for validator data dir
  ansible.builtin.command: "chown -R {{ nimbus_user }}:{{ nimbus_user }} {{ nimbus_validator_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false
  when: nimbus_validator_enabled

- name: Checkpoint sync nimbus node
  when: nimbus_enabled and nimbus_checkpoint_sync_enabled
  community.docker.docker_container:
    name: "{{ nimbus_checkpoint_container_name }}"
    image: "{{ nimbus_container_image }}"
    image_name_mismatch: recreate
    state: started
    detach: false
    auto_remove: "{{ nimbus_checkpoint_autoremove_enabled }}"
    restart_policy: "no"
    stop_timeout: "{{ nimbus_container_stop_timeout }}"
    volumes: "{{ nimbus_container_volumes }}"
    env: "{{ nimbus_container_env }}"
    networks: "{{ nimbus_checkpoint_container_networks }}"
    command: "{{ nimbus_checkpoint_container_command + nimbus_checkpoint_container_command_extra_args }}"
    user: "{{ nimbus_user_meta.uid }}"
    security_opts: "{{ nimbus_container_security_opts }}"

- name: Deploy through upgradoor {{ nimbus_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', nimbus_container_name,
          '--image', nimbus_container_image, '--command',
          (nimbus_validator_enabled | ternary(
             nimbus_container_command + nimbus_validator_container_args + nimbus_container_command_extra_args +
             (nimbus_mev_boost_enabled | ternary(nimbus_mev_boost_beacon_command, [])),
             nimbus_container_command + nimbus_container_command_extra_args,
           )) | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: nimbus_upgradoor_deploy
  changed_when: nimbus_upgradoor_deploy.stdout is match('{') and (nimbus_upgradoor_deploy.stdout | from_json).changed
  when:
    - nimbus_enabled
    - nimbus_upgradoor_enabled | bool

- name: Run nimbus container
  when: nimbus_enabled
  vars:
    nimbus_upgradoor: >-
      {{ nimbus_upgradoor_deploy.stdout | from_json
         if nimbus_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ nimbus_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(nimbus_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.kind': 'cl'}
         | combine({'io.ethpandaops.upgradoor.team': nimbus_upgradoor_team} if nimbus_upgradoor_team else {})
         if nimbus_upgradoor_enabled | bool else {} }}
    image: "{{ nimbus_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ nimbus_container_stop_timeout }}"
    ports: "{{ nimbus_container_ports }}"
    volumes: >-
      {{
        nimbus_validator_enabled | ternary(
          nimbus_container_volumes + nimbus_validator_container_volumes,
          nimbus_container_volumes
        )
      }}
    env: "{{ nimbus_container_env }}"
    networks: "{{ nimbus_container_networks }}"
    entrypoint: "{{ nimbus_container_entrypoint | default(omit) }}"
    command: >-
      {{
        nimbus_validator_enabled | ternary(
          nimbus_container_command + nimbus_validator_container_args + nimbus_container_command_extra_args +
          (nimbus_mev_boost_enabled | ternary(nimbus_mev_boost_beacon_command, [])),
          nimbus_container_command + nimbus_container_command_extra_args,
        )
      }}
    user: "{{ nimbus_user_meta.uid }}"
    pull: "{{ nimbus_container_pull | bool }}"
    security_opts: "{{ nimbus_container_security_opts }}"
    memory: "{{ nimbus_container_memory | default(omit) }}"
    memory_reservation: "{{ nimbus_container_memory_reservation | default(omit) }}"
    memory_swap: "{{ nimbus_container_memory_swap | default(omit) }}"
    memory_swappiness: "{{ nimbus_container_memory_swappiness | default(omit) }}"
    kernel_memory: "{{ nimbus_container_kernel_memory | default(omit) }}"
    cpus: "{{ nimbus_container_cpus | default(omit) }}"
    cpuset_cpus: "{{ nimbus_container_cpuset_cpus | default(omit) }}"
    cpuset_mems: "{{ nimbus_container_cpuset_mems | default(omit) }}"
    cpu_shares: "{{ nimbus_container_cpu_shares | default(omit) }}"
    cpu_quota: "{{ nimbus_container_cpu_quota | default(omit) }}"
    cpu_period: "{{ nimbus_container_cpu_period | default(omit) }}"

- name: Deploy through upgradoor {{ nimbus_validator_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', nimbus_validator_container_name,
          '--image', nimbus_validator_container_image, '--command', nimbus_validator_container_command | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: nimbus_validator_upgradoor_deploy
  changed_when: nimbus_validator_upgradoor_deploy.stdout is match('{') and (nimbus_validator_upgradoor_deploy.stdout | from_json).changed
  when:
    - nimbus_validator_enabled and (not nimbus_enabled)
    - nimbus_upgradoor_enabled | bool

- name: Run nimbus validator container
  when: nimbus_validator_enabled and (not nimbus_enabled)
  vars:
    nimbus_validator_upgradoor: >-
      {{ nimbus_validator_upgradoor_deploy.stdout | from_json
         if nimbus_validator_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ nimbus_validator_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(nimbus_validator_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.kind': 'vc'}
         | combine({'io.ethpandaops.upgradoor.team': nimbus_validator_upgradoor_team} if nimbus_validator_upgradoor_team else {})
         if nimbus_upgradoor_enabled | bool else {} }}
    image: "{{ nimbus_validator_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ nimbus_container_stop_timeout }}"
    ports: []
    volumes: "{{ nimbus_validator_container_volumes }}"
    env: "{{ nimbus_container_env }}"
    networks: "{{ nimbus_container_networks }}"
    entrypoint: "{{ nimbus_container_entrypoint | default(omit) }}"
    command: "{{ nimbus_validator_container_command }}"
    user: "{{ nimbus_user_meta.uid }}"
    pull: "{{ nimbus_container_pull | bool }}"
    security_opts: "{{ nimbus_container_security_opts }}"
