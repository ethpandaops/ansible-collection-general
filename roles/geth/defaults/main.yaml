geth_user: geth
geth_datadir: /data/geth
geth_auth_jwt_path: /data/execution-auth.secret
geth_announced_ip: "{{ ansible_host }}"
geth_public_ipv6: ""
geth_announced_ipv6: >-
  {{ geth_public_ipv6 if (geth_public_ipv6 | length > 0)
  else (ansible_default_ipv6.address
  if geth_ipv6_enabled and ansible_default_ipv6.address is defined else '') }}

geth_cleanup: false # when set to "true" it will remove the container

geth_ports_p2p: 30303
geth_ports_http_rpc: 8545
geth_ports_engine: 8551
geth_ports_metrics: 6060

geth_ipv6_enabled: false

geth_container_name: geth
geth_container_image: ethereum/client-go:stable
geth_container_env: {}
# geth_container_entrypoint:
geth_container_ports_ipv4:
  - "127.0.0.1:{{ geth_ports_http_rpc }}:{{ geth_ports_http_rpc }}"
  - "127.0.0.1:{{ geth_ports_engine }}:{{ geth_ports_engine }}"
  - "127.0.0.1:{{ geth_ports_metrics }}:{{ geth_ports_metrics }}"
  - "0.0.0.0:{{ geth_ports_p2p }}:{{ geth_ports_p2p }}"
  - "0.0.0.0:{{ geth_ports_p2p }}:{{ geth_ports_p2p }}/udp"

geth_container_ports_ipv6:
  - "[::]:{{ geth_ports_p2p }}:{{ geth_ports_p2p }}"
  - "[::]:{{ geth_ports_p2p }}:{{ geth_ports_p2p }}/udp"

geth_container_ports: >-
  {{ geth_container_ports_ipv4 +
  (geth_container_ports_ipv6
  if geth_ipv6_enabled and ansible_default_ipv6.address is defined
  and (geth_public_ipv6 | length == 0) else []) }}

geth_container_volumes:
  - "{{ geth_datadir }}:/data"
  - "{{ geth_auth_jwt_path }}:/execution-auth.jwt:ro"
geth_container_security_opts: []
# geth_container_memory:
# geth_container_memory_reservation:
# geth_container_memory_swap:
# geth_container_memory_swappiness:
# geth_container_kernel_memory:
# geth_container_cpus:
# geth_container_cpuset_cpus:
# geth_container_cpuset_mems:
# geth_container_cpu_shares:
# geth_container_cpu_quota:
# geth_container_cpu_period:
geth_container_stop_timeout: "300"
geth_container_networks: []
geth_container_command_default:
  - --datadir=/data
  - --port={{ geth_ports_p2p }}
  - --http
  - --http.addr=0.0.0.0
  - --http.port={{ geth_ports_http_rpc }}
  - --authrpc.addr=0.0.0.0
  - --authrpc.port={{ geth_ports_engine }}
  - --authrpc.vhosts=*
  - --authrpc.jwtsecret=/execution-auth.jwt
  - --nat=extip:{{ geth_announced_ip }}
  - --metrics
  - --metrics.port={{ geth_ports_metrics }}
  - --metrics.addr=0.0.0.0
  - --discovery.v5

geth_container_command_v6:
  - --nat=extip:{{ geth_announced_ipv6 }}

geth_container_command: >-
  {{ geth_container_command_default + (geth_container_command_v6 if geth_ipv6_enabled and ansible_default_ipv6.address is defined else []) }}

geth_container_command_extra_args: []
#  - --http.api=eth,net,web3
#  - --http.vhosts=*
geth_container_command_all: "{{ geth_container_command + geth_container_command_extra_args }}"

# Default image pull policy
geth_container_pull: false

################################################################################
##
## upgradoor
##
################################################################################
geth_upgradoor_enabled: "{{ upgradoor_enabled | default(false) }}"
geth_upgradoor_team: geth
geth_upgradoor_result: >-
  {{ geth_upgradoor_deploy.stdout | from_json
     if (geth_upgradoor_deploy.stdout | default('')) is match('{') else {} }}
geth_upgradoor_deploy_argv: >-
  {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', geth_container_name,
      '--image', geth_container_image, '--command', geth_container_command_all | to_json]
     + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
       | mandatory('upgradoor_deploy must be soft, force or immediate') }}
geth_upgradoor_labels: >-
  {{ {'io.ethpandaops.upgradoor.kind': 'el'}
     | combine({'io.ethpandaops.upgradoor.team': geth_upgradoor_team} if geth_upgradoor_team else {})
     if geth_upgradoor_enabled | bool else {} }}
geth_upgradoor_comparisons: >-
  {{ {} if upgradoor_deploy | default('soft') == 'immediate'
     else dict(geth_upgradoor_result.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
geth_upgradoor_pull: >-
  {{ upgradoor_deploy | default('soft') == 'immediate'
     or (geth_upgradoor_result.pull | default(geth_container_pull | bool)) }}
