- name: Add geth user
  ansible.builtin.user:
    name: "{{ geth_user }}"
  register: geth_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ geth_datadir }}"
    state: directory
    mode: "0750"
    owner: "{{ geth_user }}"
    group: "{{ geth_user }}"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ geth_user }}:{{ geth_user }} {{ geth_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Deploy through upgradoor {{ geth_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', geth_container_name,
          '--image', geth_container_image, '--command',
          (geth_container_command + geth_container_command_extra_args) | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: geth_upgradoor_deploy
  changed_when: geth_upgradoor_deploy.stdout is match('{') and (geth_upgradoor_deploy.stdout | from_json).changed
  when: secret_upgradoor_seed is defined

- name: Run geth container
  vars:
    geth_upgradoor: >-
      {{ geth_upgradoor_deploy.stdout | from_json
         if geth_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ geth_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(geth_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.group': geth_upgradoor_group, 'io.ethpandaops.upgradoor.kind': 'el'}
         if geth_upgradoor and geth_upgradoor_group else {} }}
    image: "{{ geth_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ geth_container_stop_timeout }}"
    ports: "{{ geth_container_ports }}"
    volumes: "{{ geth_container_volumes }}"
    env: "{{ geth_container_env }}"
    networks: "{{ geth_container_networks }}"
    entrypoint: "{{ geth_container_entrypoint | default(omit) }}"
    command: "{{ geth_container_command + geth_container_command_extra_args }}"
    user: "{{ geth_user_meta.uid }}"
    pull: "{{ geth_container_pull | bool }}"
    security_opts: "{{ geth_container_security_opts }}"
    memory: "{{ geth_container_memory | default(omit) }}"
    memory_reservation: "{{ geth_container_memory_reservation | default(omit) }}"
    memory_swap: "{{ geth_container_memory_swap | default(omit) }}"
    memory_swappiness: "{{ geth_container_memory_swappiness | default(omit) }}"
    kernel_memory: "{{ geth_container_kernel_memory | default(omit) }}"
    cpus: "{{ geth_container_cpus | default(omit) }}"
    cpuset_cpus: "{{ geth_container_cpuset_cpus | default(omit) }}"
    cpuset_mems: "{{ geth_container_cpuset_mems | default(omit) }}"
    cpu_shares: "{{ geth_container_cpu_shares | default(omit) }}"
    cpu_quota: "{{ geth_container_cpu_quota | default(omit) }}"
    cpu_period: "{{ geth_container_cpu_period | default(omit) }}"
