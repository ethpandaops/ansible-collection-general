- name: Verify
  hosts: molecule
  become: true
  tasks:
    - name: Stat installed files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/upgradoor
        - /usr/local/lib/upgradoor/install.sh
        - /usr/local/lib/upgradoor/allowed_signers
        - /usr/local/lib/upgradoor/upgrade-packages
        - /usr/local/lib/upgradoor/security-upgrades
        - /etc/upgradoor
        - /etc/upgradoor/agent.yaml
        - /etc/upgradoor/host.key
        - /etc/upgradoor/host.crt
        - /data/upgradoor
        - /etc/sudoers.d/upgradoor-agent
      register: upgradoor_agent_stat

    - name: Assert files, owners and modes
      ansible.builtin.assert:
        that:
          - item.stat.pw_name ~ ':' ~ item.stat.gr_name ~ ' ' ~ item.stat.mode == upgradoor_agent_want[item.item]
        fail_msg: "{{ item.item }}: {{ item.stat.pw_name | default('missing') }}:{{ item.stat.gr_name | default('') }} {{ item.stat.mode | default('') }}"
        quiet: true
      loop: "{{ upgradoor_agent_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        upgradoor_agent_want:
          /usr/local/bin/upgradoor: root:root 0755
          /usr/local/lib/upgradoor/install.sh: root:root 0755
          /usr/local/lib/upgradoor/allowed_signers: root:root 0644
          /usr/local/lib/upgradoor/upgrade-packages: root:root 0755
          /usr/local/lib/upgradoor/security-upgrades: root:root 0755
          /etc/upgradoor: root:upgradoor 0750
          /etc/upgradoor/agent.yaml: root:root 0644
          /etc/upgradoor/host.key: root:upgradoor 0640
          /etc/upgradoor/host.crt: root:upgradoor 0640
          /data/upgradoor: upgradoor:upgradoor 0700
          /etc/sudoers.d/upgradoor-agent: root:root 0440

    - name: Read the config, the unit, the release seq and the sudoers rules
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/upgradoor/agent.yaml
        - /etc/systemd/system/upgradoor-agent.service
        - /etc/upgradoor/release-seq
        - /etc/sudoers.d/upgradoor-agent
      register: upgradoor_agent_slurp

    - name: Assert config, unit, release and sudoers rules
      ansible.builtin.assert:
        that:
          - upgradoor_agent_config.controller.publicKey == upgradoor_controller_public_key
          - upgradoor_agent_config.roles == ['ethereum_node']
          - "'overridesFile' not in upgradoor_agent_config"
          - upgradoor_agent_config.defaultPolicy == 'ignore'
          - "upgradoor_agent_config.kindPolicies == {'el': {'roll': true}, 'snooper-el': {'roll': false}}"
          - "upgradoor_agent_config.docker == {'host': 'unix:///var/run/docker.sock', 'authFile': '/etc/upgradoor/registry-auth.json'}"
          - "upgradoor_agent_config.fallback == {'after': '24h', 'interval': '6h'}"
          - >-
            upgradoor_agent_config.probes == {
              'el': 'http://127.0.0.1:8545', 'cl': 'http://127.0.0.1:5052', 'snooper-el': 'http://127.0.0.1:9000/health',
            }
          - upgradoor_agent_config.keys() | intersect(['groups', 'containers', 'defaultGroup', 'registry', 'validators']) | length == 0
          - >-
            upgradoor_agent_config.actions == {'security-upgrades': {
              'description': 'Install pending security updates (unattended-upgrades)',
              'command': ['/usr/bin/sudo', '-n', '/usr/local/lib/upgradoor/security-upgrades'],
              'impact': 'independent', 'timeout': '30m', 'when': 'securityUpdates',
            }}
          - upgradoor_agent_unit is search('(?m)^User=upgradoor$')
          - upgradoor_agent_unit is search('(?m)^KillMode=process$')
          - upgradoor_agent_seq == "2000 v0.2.0\n"
          - >-
            upgradoor_agent_sudoers is search('(?m)^upgradoor ALL=\\(root\\) NOPASSWD: /usr/local/lib/upgradoor/security-upgrades ""$')
        quiet: true
      vars:
        upgradoor_agent_config: "{{ upgradoor_agent_slurp.results[0].content | b64decode | from_yaml }}"
        upgradoor_agent_unit: "{{ upgradoor_agent_slurp.results[1].content | b64decode }}"
        upgradoor_agent_seq: "{{ upgradoor_agent_slurp.results[2].content | b64decode }}"
        upgradoor_agent_sudoers: "{{ upgradoor_agent_slurp.results[3].content | b64decode }}"

    - name: Let visudo check the sudoers rules
      ansible.builtin.command:
        cmd: visudo -cf /etc/sudoers.d/upgradoor-agent
      changed_when: false

    - name: Read the host public key and the certificate's claims
      ansible.builtin.shell:
        cmd: |
          set -eu
          upgradoor key
          upgradoor verify-cert --network testnet-devnet-0 --signer-public-key {{ upgradoor_signer_public_key | quote }} < /etc/upgradoor/host.crt
      register: upgradoor_agent_identity
      changed_when: false

    - name: Assert the certificate certifies this host's key
      ansible.builtin.assert:
        that:
          - >-
            upgradoor_agent_identity.stdout_lines[1] | from_json
            == {'hostname': 'lighthouse-geth-1', 'network': 'testnet-devnet-0', 'publicKey': upgradoor_agent_identity.stdout_lines[0]}
        quiet: true

    - name: Let systemd check the unit
      ansible.builtin.command:
        cmd: systemd-analyze verify /etc/systemd/system/upgradoor-agent.service
      register: upgradoor_agent_unit_verify
      changed_when: false
      failed_when: upgradoor_agent_unit_verify.rc != 0 or upgradoor_agent_unit_verify.stderr | length > 0

    - name: Read the unit state
      ansible.builtin.systemd:
        name: upgradoor-agent.service
      register: upgradoor_agent_unit_state

    - name: Assert the agent runs
      ansible.builtin.assert:
        that:
          - upgradoor_agent_unit_state.status.UnitFileState == 'enabled'
          - upgradoor_agent_unit_state.status.ActiveState == 'active'
        quiet: true

    # No blocked package is installed here, so the script exits before apt.
    - name: Run the agent's sudo commands as the agent
      ansible.builtin.command:
        argv: "{{ ['/usr/bin/sudo', '-u', 'upgradoor', '--', '/usr/bin/sudo', '-n'] + item.argv }}"
      loop:
        - {argv: [/usr/local/lib/upgradoor/upgrade-packages, docker-ce, containerd.io], rc: 0}
        - {argv: [/usr/local/lib/upgradoor/upgrade-packages, docker-ce, bash], rc: 2}
        - {argv: [-l, /usr/bin/systemctl, reboot], rc: 0}
        - {argv: [-l, /usr/local/lib/upgradoor/security-upgrades], rc: 0}
        - {argv: [/usr/local/lib/upgradoor/security-upgrades, --help], rc: 1}
        - {argv: [/usr/bin/apt-get, update], rc: 1}
      loop_control:
        label: "{{ item.argv | join(' ') }}"
      register: upgradoor_agent_sudo
      changed_when: false
      failed_when: upgradoor_agent_sudo.rc != item.rc

    - name: Assert the agent's user and the entry user's group
      ansible.builtin.command:
        cmd: id -nG {{ item }}
      loop: [upgradoor, devops]
      register: upgradoor_agent_ids
      changed_when: false
      failed_when: >-
        upgradoor_agent_ids.stdout.split() | intersect(['upgradoor', 'docker', 'sudo', 'root']) | sort
        != (['docker', 'upgradoor'] if item == 'upgradoor' else ['upgradoor'])

    - name: Prove the certificate is issued once, and again for a new key
      ansible.builtin.include_tasks:
        file: tasks/certificate.yml
      loop:
        - {name: the same host, issued: false}
        - {name: a new host key, remove: /etc/upgradoor/host.key, issued: true}
        - {name: a removed certificate, remove: /etc/upgradoor/host.crt, issued: true}
        - {name: reissue, reissue: true, issued: true}
        - {name: the same host again, issued: false}
      loop_control:
        loop_var: upgradoor_agent_case
        label: "{{ upgradoor_agent_case.name }}"

    # A container deployed before the labels: the hook leaves nothing to the
    # agent, so Ansible recreates it once with its labels.
    - name: Run an unlabelled geth container
      community.docker.docker_container:
        name: geth
        image: "busybox:1.35"
        command: [sleep, "86400"]
        stop_timeout: 1
        state: started

    # A client role deploys through the agent: one container, all modes;
    # overrides are off.
    - name: Prove the client role hook without overrides
      ansible.builtin.include_tasks:
        file: tasks/client_hook.yml
      loop:
        - {name: soft deploy of an unlabelled container, mode: soft, image: "busybox:1.36", roll: none, recreated: true, running: "busybox:1.36"}
        - {name: soft deploy of a new image, mode: soft, image: "busybox:1.37", roll: requested, changed: true, recreated: false, running: "busybox:1.36"}
        - {name: force deploy, mode: force, image: "busybox:1.37", roll: requested, changed: false, recreated: false, running: "busybox:1.36"}
        - {name: immediate deploy, mode: immediate, image: "busybox:1.37", recreated: true, running: "busybox:1.37"}
        - {name: immediate deploy again, mode: immediate, image: "busybox:1.37", changed: false, recreated: false, running: "busybox:1.37"}
      loop_control:
        loop_var: upgradoor_agent_case
        label: "{{ upgradoor_agent_case.name }}"

    - name: Stat managed.yaml, the overrides file and its link
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/upgradoor/managed.yaml
        - /etc/upgradoor/overrides/overrides.yaml
        - /home/devops/overrides.yaml
      register: upgradoor_agent_files_off

    - name: Try an override without overrides
      ansible.builtin.command:
        argv: [upgradoor, override, set, geth, --image, "busybox:1.36"]
      register: upgradoor_agent_override_off
      changed_when: false
      failed_when: upgradoor_agent_override_off.rc == 0 or 'overrides are disabled on this host' not in upgradoor_agent_override_off.stderr

    - name: Assert managed.yaml is root's and there is no overrides file
      ansible.builtin.assert:
        that:
          - upgradoor_agent_files_off.results[0].stat.pw_name ~ ':' ~ upgradoor_agent_files_off.results[0].stat.gr_name == 'root:upgradoor'
          - upgradoor_agent_files_off.results[0].stat.mode == '0640'
          - not upgradoor_agent_files_off.results[1].stat.exists
          - not upgradoor_agent_files_off.results[2].stat.exists
        quiet: true

    # Overrides on: the agent lays out the overrides file; a soft deploy
    # keeps an override, force and immediate deploys clear it.
    - name: Prove the client role hook with overrides
      vars:
        upgradoor_agent_default_entry: "  geth:\n    # default image: busybox:1.37\n    # default command:\n    #   - sleep\n    #   - \"86400\"\n"
        upgradoor_agent_empty_entry: "    #   - \"86400\"\n    # image:\n    # command:\n    # reason:\n    # until:\n"
      block:
        - name: Apply the role with overrides
          ansible.builtin.include_role:
            name: upgradoor_agent
          vars:
            upgradoor_agent_overrides: true

        - name: Restart the agent with overrides
          ansible.builtin.meta: flush_handlers

        - name: Wait for the agent's socket
          ansible.builtin.wait_for:
            path: /run/upgradoor/agent.sock
            timeout: 30

        - name: Deploy geth with the client role and overrides
          ansible.builtin.include_tasks:
            file: tasks/client_hook.yml
          loop:
            - name: soft deploy lays out the overrides file
              mode: soft
              image: "busybox:1.37"
              changed: false
              recreated: false
              running: "busybox:1.37"
              entry: "{{ upgradoor_agent_default_entry ~ '    # image:\n' }}"
            - name: soft deploy keeps an override
              mode: soft
              image: "busybox:1.37"
              override: "busybox:1.36"
              roll: requested
              changed: false
              recreated: false
              running: "busybox:1.37"
              entry: "{{ upgradoor_agent_default_entry ~ '    image: busybox:1.36\n    by: root\n    reason: test\n' }}"
            - name: force deploy clears the override
              mode: force
              image: "busybox:1.37"
              changed: true
              recreated: false
              running: "busybox:1.37"
              entry: "{{ upgradoor_agent_empty_entry }}"
            - name: immediate deploy clears the override
              mode: immediate
              image: "busybox:1.36"
              override: "busybox:1.37"
              changed: true
              recreated: true
              running: "busybox:1.36"
              entry: "{{ upgradoor_agent_empty_entry }}"
          loop_control:
            loop_var: upgradoor_agent_case
            label: "{{ upgradoor_agent_case.name }}"

        - name: Set and clear an override
          ansible.builtin.command:
            argv: "{{ ['upgradoor', 'override'] + item }}"
          loop:
            - [set, geth, --image, "busybox:1.37", --add-flag=--verbose, --reason, test]
            - [clear, geth]
          register: upgradoor_agent_set_clear
          changed_when: true

        - name: Read the overrides file after the clear
          ansible.builtin.slurp:
            src: /etc/upgradoor/overrides/overrides.yaml
          register: upgradoor_agent_overrides_after

        - name: Assert the clear put the commented structure back
          ansible.builtin.assert:
            that:
              - "'set image busybox:1.37, command sleep 86400 --verbose; was nothing' in upgradoor_agent_overrides_text"
              - "'cleared; was image busybox:1.37, command sleep 86400 --verbose' in upgradoor_agent_overrides_text"
              - upgradoor_agent_empty_entry in upgradoor_agent_overrides_text
              - "(upgradoor_agent_overrides_text | from_yaml).overrides == {'geth': none}"
            fail_msg: "{{ upgradoor_agent_overrides_text }}"
            quiet: true
          vars:
            upgradoor_agent_overrides_text: "{{ upgradoor_agent_overrides_after.content | b64decode }}"

        # A kind without a team is managed and never overridable.
        - name: Run a snooper container without a team
          community.docker.docker_container:
            name: snooper
            image: "busybox:1.37"
            command: [sleep, "86400"]
            stop_timeout: 1
            labels:
              io.ethpandaops.upgradoor.kind: snooper-el
            state: started

        - name: List the managed containers
          ansible.builtin.command:
            argv: [upgradoor, list]
          register: upgradoor_agent_list
          # The agent sees the container with its next cycle.
          retries: 10
          delay: 1
          until: "'snooper  (snooper-el, no team, running)' in upgradoor_agent_list.stdout"
          changed_when: false

        - name: Try an override of the snooper
          ansible.builtin.command:
            argv: [upgradoor, override, set, snooper, --image, "busybox:1.36"]
          register: upgradoor_agent_override_teamless
          changed_when: false
          failed_when: >-
            upgradoor_agent_override_teamless.rc == 0
            or 'has no io.ethpandaops.upgradoor.team label' not in upgradoor_agent_override_teamless.stderr

        - name: Read the overrides file with the snooper
          ansible.builtin.slurp:
            src: /etc/upgradoor/overrides/overrides.yaml
          register: upgradoor_agent_overrides_snooper

        - name: Assert only the container with a team has a key
          ansible.builtin.assert:
            that:
              - "'geth  (el of geth, running)' in upgradoor_agent_list.stdout"
              - "'  geth:' in upgradoor_agent_overrides_snooper_text"
              - "'snooper' not in upgradoor_agent_overrides_snooper_text"
            fail_msg: "{{ upgradoor_agent_list.stdout }} {{ upgradoor_agent_overrides_snooper_text }}"
            quiet: true
          vars:
            upgradoor_agent_overrides_snooper_text: "{{ upgradoor_agent_overrides_snooper.content | b64decode }}"

        # The running agent writes a missing overrides file.
        - name: Remove the overrides file
          ansible.builtin.file:
            path: /etc/upgradoor/overrides/overrides.yaml
            state: absent

        - name: Wait for the agent to write the overrides file
          ansible.builtin.wait_for:
            path: /etc/upgradoor/overrides/overrides.yaml
            timeout: 30

        - name: Stat the overrides directory, file and link
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - /etc/upgradoor/overrides
            - /etc/upgradoor/overrides/overrides.yaml
            - /home/devops/overrides.yaml
          register: upgradoor_agent_overrides_stat

        - name: Assert the overrides file is the agent's and linked for the entry user
          ansible.builtin.assert:
            that:
              - upgradoor_agent_overrides_stat.results[0].stat.pw_name ~ ' ' ~ upgradoor_agent_overrides_stat.results[0].stat.mode == 'upgradoor 2775'
              - upgradoor_agent_overrides_stat.results[1].stat.pw_name == 'upgradoor'
              - upgradoor_agent_overrides_stat.results[1].stat.mode == '0664'
              - upgradoor_agent_overrides_stat.results[2].stat.lnk_source == '/etc/upgradoor/overrides/overrides.yaml'
              - upgradoor_agent_overrides_stat.results[2].stat.pw_name == 'devops'
            quiet: true
      always:
        - name: Remove the geth and snooper containers
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
          loop: [geth, snooper]

    # Role switch off: no hook, no labels. The snooper gets its label only,
    # without the hook.
    - name: Prove a client role with its switch off and the snooper label
      block:
        - name: Run the geth role with its switch off
          ansible.builtin.include_role:
            name: geth
          vars:
            geth_upgradoor_enabled: false # noqa: var-naming[no-role-prefix]
            geth_container_name: geth-plain # noqa: var-naming[no-role-prefix]
            geth_container_image: "busybox:1.37" # noqa: var-naming[no-role-prefix]
            geth_container_command: [sleep, "86400"] # noqa: var-naming[no-role-prefix]
            geth_container_ports: [] # noqa: var-naming[no-role-prefix]
            geth_container_volumes: [] # noqa: var-naming[no-role-prefix]
            geth_container_stop_timeout: "1" # noqa: var-naming[no-role-prefix]

        - name: Run the snooper role
          ansible.builtin.include_role:
            name: json_rpc_snooper
          vars:
            json_rpc_snooper_upgradoor_kind: snooper-el # noqa: var-naming[no-role-prefix]
            json_rpc_snooper_container_image: "busybox:1.37" # noqa: var-naming[no-role-prefix]
            json_rpc_snooper_container_command: [sleep, "86400"] # noqa: var-naming[no-role-prefix]
            json_rpc_snooper_container_ports: [] # noqa: var-naming[no-role-prefix]

        - name: Look at the containers
          community.docker.docker_container_info:
            name: "{{ item }}"
          loop: [geth-plain, snooper]
          register: upgradoor_agent_plain

        - name: Read managed.yaml with the switch off
          ansible.builtin.slurp:
            src: /etc/upgradoor/managed.yaml
          register: upgradoor_agent_plain_managed

        - name: Assert the labels and no managed.yaml entries
          ansible.builtin.assert:
            that:
              - upgradoor_agent_plain.results[0].container.State.Running
              - upgradoor_agent_plain.results[0].container.Config.Labels | default({}, true) | select('match', 'io.ethpandaops.upgradoor') | list == []
              - upgradoor_agent_plain.results[1].container.Config.Labels['io.ethpandaops.upgradoor.kind'] == 'snooper-el'
              - "'io.ethpandaops.upgradoor.team' not in upgradoor_agent_plain.results[1].container.Config.Labels"
              - (upgradoor_agent_plain_managed.content | b64decode | from_yaml).containers.keys() | intersect(['geth-plain', 'snooper']) == []
            fail_msg: >-
              {{ upgradoor_agent_plain.results | map(attribute='container.Config.Labels') }}
              {{ upgradoor_agent_plain_managed.content | b64decode }}
            quiet: true
      always:
        - name: Remove the geth-plain and snooper containers
          community.docker.docker_container:
            name: "{{ item }}"
            state: absent
          loop: [geth-plain, snooper]

    - name: Prove that the role installs only a signed, newer release
      ansible.builtin.include_tasks:
        file: tasks/release_case.yml
      loop:
        - {version: v0.2.1, reason: does not verify}
        - {version: v0.2.2, reason: does not verify}
        - {version: v0.2.4, reason: the manifest lists}
        - {version: v0.2.0-rc1, reason: must be latest or a release tag}
        - {version: v0.3.0, seq: 3000}
        - {version: v0.1.5, reason: refusing a downgrade}
      loop_control:
        loop_var: upgradoor_agent_case
        label: "{{ upgradoor_agent_case.version }}"
