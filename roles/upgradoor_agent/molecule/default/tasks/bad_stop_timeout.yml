- name: Apply the role with stop_timeout {{ upgradoor_agent_bad_stop_timeout | to_json }}
  block:
    - name: Run upgradoor_agent with stop_timeout {{ upgradoor_agent_bad_stop_timeout | to_json }}
      ansible.builtin.include_role:
        name: upgradoor_agent
      vars:
        upgradoor_agent_extra_groups:
          proxy:
            stop_timeout: "{{ upgradoor_agent_bad_stop_timeout }}"

    - name: The role must not get here
      ansible.builtin.fail:
        msg: "stop_timeout was accepted: {{ upgradoor_agent_bad_stop_timeout | to_json }}"
  rescue:
    - name: Assert the role refused the stop_timeout
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Check the upgradoor input'
          - "\"upgradoor group 'proxy'\" in upgradoor_agent_refusal"
        fail_msg: "{{ ansible_failed_task.name }}: {{ upgradoor_agent_refusal }}"
        quiet: true
      vars:
        upgradoor_agent_refusal: >-
          {{ ansible_failed_result.results | default([ansible_failed_result])
             | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | join(' ') }}
