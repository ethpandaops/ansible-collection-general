# Fake releases signed with throwaway ed25519 keys, served from file:// URLs.
# Each serves its own binary, so an install shows in the checksum.
- name: Set the fake release paths
  ansible.builtin.set_fact:
    upgradoor_agent_test_release_dir: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') | default(playbook_dir ~ '/.molecule', true) }}/release
    upgradoor_agent_test_host_dir: /srv/upgradoor-release
    upgradoor_agent_test_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}

- name: Create the fake release directory on the controller
  ansible.builtin.file:
    path: "{{ upgradoor_agent_test_release_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: [keys, bin]
  become: false
  delegate_to: localhost
  run_once: true

- name: Fetch the binary converge installed
  ansible.builtin.fetch:
    src: /usr/local/bin/upgradoor
    dest: "{{ upgradoor_agent_test_release_dir }}/bin/upgradoor"
    flat: true

- name: Write a tampered binary
  ansible.builtin.copy:
    content: "#!/bin/sh\necho tampered\n"
    dest: "{{ upgradoor_agent_test_release_dir }}/bin/tampered"
    mode: "0755"
  become: false
  delegate_to: localhost
  run_once: true

- name: Create the release key and another key
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C {{ item }} -f {{ (upgradoor_agent_test_release_dir ~ '/keys/' ~ item) | quote }}
    creates: "{{ upgradoor_agent_test_release_dir }}/keys/{{ item }}"
  loop: [release, other]
  become: false
  delegate_to: localhost
  run_once: true

- name: Write the allowed_signers file of the release key
  ansible.builtin.copy:
    content: >
      upgradoor-release namespaces="upgradoor-release"
      {{ lookup('ansible.builtin.file', upgradoor_agent_test_release_dir ~ '/keys/release.pub').split()[:2] | join(' ') }}
    dest: "{{ upgradoor_agent_test_release_dir }}/keys/allowed_signers"
    mode: "0600"
  become: false
  delegate_to: localhost
  run_once: true

# dir: tag asked for; version: tag of the manifest; tamper: manifest changed
# after signing; tampered: binary does not match the manifest.
- name: Build the fake releases
  ansible.builtin.include_tasks:
    file: fake_release.yml
  loop:
    - {dir: v0.2.0}
    - {dir: v0.3.0}
    - {dir: v0.1.5}
    - {dir: v0.2.1, tamper: true}
    - {dir: v0.2.2, key: other}
    - {dir: v0.2.3, version: v0.3.1}
    - {dir: v0.2.4, tampered: true}
    - {dir: v0.2.5, namespace: other-namespace}
    - {dir: v0.2.6, extra: ["upgradoor 2006 linux-{{ upgradoor_agent_test_arch }} {{ '0' * 64 }}"]}
    - {dir: v0.2.7, extra: ["zz-future-artifact 2007 something {{ '1' * 64 }}"]}
    - {dir: v0.2.8, extra: ["image 2008 ghcr.io/ethpandaops/upgradoor {{ '2' * 64 }}"]}
    - {dir: v0.2.9, no_image: true}
    - {dir: v0.2.10, controller_only: true}
    - {dir: v0.2.11, extra: ["zz 2011 note upgradoor 2011 linux-{{ upgradoor_agent_test_arch }} {{ '3' * 64 }}"]}
    - {dir: v0.2.12, crlf: true}
  loop_control:
    loop_var: upgradoor_agent_test_release
    label: "{{ upgradoor_agent_test_release.dir }}"
  vars:
    upgradoor_agent_test_dir: "{{ upgradoor_agent_test_release_dir }}/{{ upgradoor_agent_test_release.dir }}"
    upgradoor_agent_test_version: "{{ upgradoor_agent_test_release.version | default(upgradoor_agent_test_release.dir) }}"
    upgradoor_agent_test_seq: >-
      {{ (upgradoor_agent_test_version[1:].split('.')[0] | int) * 1000000
         + (upgradoor_agent_test_version[1:].split('.')[1] | int) * 1000
         + (upgradoor_agent_test_version[1:].split('.')[2] | int) }}

# refused_by: refusing task, reason: part of its message; seq: installs;
# ignored: under ignore_errors nothing changes.
- name: Try the fake releases
  ansible.builtin.include_tasks:
    file: release_case.yml
  loop:
    - {version: v0.2.1, refused_by: 'Verify the signature of upgradoor v0.2.1'}
    - {version: v0.2.2, refused_by: 'Verify the signature of upgradoor v0.2.2'}
    - {version: v0.2.5, refused_by: 'Verify the signature of upgradoor v0.2.5'}
    - {version: v0.2.3, refused_by: 'Check the manifest of upgradoor v0.2.3'}
    - {version: v0.2.6, refused_by: 'Check the manifest of upgradoor v0.2.6'}
    - {version: v0.2.0-rc1, refused_by: 'Check the upgradoor release tag'}
    - {version: v0.2.10, refused_by: 'Report a failed upgradoor agent apply', reason: 'no verified release of upgradoor v0.2.10'}
    - {version: v0.2.11, refused_by: 'Check the manifest of upgradoor v0.2.11'}
    - {version: v0.2.12, refused_by: 'Check the manifest of upgradoor v0.2.12'}
    - {version: v0.2.2, ignored: true}
    - {version: v0.2.0, seq: 2000, image: "ghcr.io/ethpandaops/upgradoor@sha256:{{ 'imagev0.2.0' | hash('sha256') }}"}
    - {version: v0.2.8, refused_by: 'Check the manifest of upgradoor v0.2.8'}
    - {version: v0.2.9, refused_by: 'Check the manifest of upgradoor v0.2.9'}
    - {version: v0.2.4, refused_by: 'Report a failed upgradoor agent apply', reason: 'the verified manifest lists'}
    - {version: v0.2.7, seq: 2007}
    - {version: v0.3.0, seqfile: "", refused_by: 'Report a failed upgradoor agent apply', reason: "with one line '<seq> <version>'"}
    - {version: v0.3.0, seqfile: "2007 v0.2.7\n", seq: 3000}
    - {version: v0.1.5, refused_by: 'Report a failed upgradoor agent apply', reason: 'refusing a downgrade'}
    - {version: v0.1.5, seq: 1005, allow_downgrade: true}
  loop_control:
    loop_var: upgradoor_agent_case
    label: "{{ upgradoor_agent_case.version }}"
