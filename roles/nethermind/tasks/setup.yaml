- name: Add nethermind user
  ansible.builtin.user:
    name: "{{ nethermind_user }}"
  register: nethermind_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ nethermind_user }}"
    group: "{{ nethermind_user }}"
  loop:
    - "{{ nethermind_datadir }}"
    - "{{ nethermind_datadir }}/nethermind"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ nethermind_user }}:{{ nethermind_user }} {{ nethermind_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Deploy through upgradoor {{ nethermind_container_name }}
  ansible.builtin.command:
    argv: "{{ nethermind_upgradoor_deploy_argv }}"
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: nethermind_upgradoor_deploy
  changed_when: nethermind_upgradoor_result.changed | default(false)
  when: nethermind_upgradoor_enabled | bool

- name: Run nethermind container
  # docker_container keeps comparison modes in module globals; mitogen reuses the interpreter
  vars:
    mitogen_task_isolation: fork
  community.docker.docker_container:
    name: "{{ nethermind_container_name }}"
    comparisons: "{{ nethermind_upgradoor_comparisons }}"
    image_comparison: current-image
    labels: "{{ nethermind_upgradoor_labels }}"
    image: "{{ nethermind_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ nethermind_container_stop_timeout }}"
    ports: "{{ nethermind_container_ports }}"
    volumes: "{{ nethermind_container_volumes }}"
    env: "{{ nethermind_container_env }}"
    networks: "{{ nethermind_container_networks }}"
    entrypoint: "{{ nethermind_container_entrypoint | default(omit) }}"
    command: "{{ nethermind_container_command_all }}"
    user: "{{ nethermind_user_meta.uid }}"
    pull: "{{ nethermind_upgradoor_pull | bool }}"
    security_opts: "{{ nethermind_container_security_opts }}"
    memory: "{{ nethermind_container_memory | default(omit) }}"
    memory_reservation: "{{ nethermind_container_memory_reservation | default(omit) }}"
    memory_swap: "{{ nethermind_container_memory_swap | default(omit) }}"
    memory_swappiness: "{{ nethermind_container_memory_swappiness | default(omit) }}"
    kernel_memory: "{{ nethermind_container_kernel_memory | default(omit) }}"
    cpus: "{{ nethermind_container_cpus | default(omit) }}"
    cpuset_cpus: "{{ nethermind_container_cpuset_cpus | default(omit) }}"
    cpuset_mems: "{{ nethermind_container_cpuset_mems | default(omit) }}"
    cpu_shares: "{{ nethermind_container_cpu_shares | default(omit) }}"
    cpu_quota: "{{ nethermind_container_cpu_quota | default(omit) }}"
    cpu_period: "{{ nethermind_container_cpu_period | default(omit) }}"
