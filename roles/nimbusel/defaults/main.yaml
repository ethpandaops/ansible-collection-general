nimbusel_user: nimbusel
nimbusel_datadir: /data/nimbusel
nimbusel_auth_jwt_path: /data/execution-auth.secret
nimbusel_announced_ip: "{{ ansible_host }}"
nimbusel_public_ipv6: ""
nimbusel_announced_ipv6: >-
  {{ nimbusel_public_ipv6 if (nimbusel_public_ipv6 | length > 0)
  else (ansible_default_ipv6.address
  if nimbusel_ipv6_enabled and ansible_default_ipv6.address is defined else '') }}

nimbusel_cleanup: false # when set to "true" it will remove the container

nimbusel_ports_p2p: 30303
nimbusel_ports_http_rpc: 8545
nimbusel_ports_engine: 8551
nimbusel_ports_metrics: 6060

nimbusel_ipv6_enabled: false

nimbusel_container_name: nimbusel
nimbusel_container_image: ethpandaops/nimbus-eth1:master
nimbusel_container_env: {}
# nimbusel_container_entrypoint:
nimbusel_container_ports_ipv4:
  - "127.0.0.1:{{ nimbusel_ports_http_rpc }}:{{ nimbusel_ports_http_rpc }}"
  - "127.0.0.1:{{ nimbusel_ports_engine }}:{{ nimbusel_ports_engine }}"
  - "127.0.0.1:{{ nimbusel_ports_metrics }}:{{ nimbusel_ports_metrics }}"
  - "0.0.0.0:{{ nimbusel_ports_p2p }}:{{ nimbusel_ports_p2p }}"
  - "0.0.0.0:{{ nimbusel_ports_p2p }}:{{ nimbusel_ports_p2p }}/udp"

nimbusel_container_ports_ipv6:
  - "[::]:{{ nimbusel_ports_p2p }}:{{ nimbusel_ports_p2p }}"
  - "[::]:{{ nimbusel_ports_p2p }}:{{ nimbusel_ports_p2p }}/udp"

nimbusel_container_ports: >-
  {{ nimbusel_container_ports_ipv4 +
  (nimbusel_container_ports_ipv6
  if nimbusel_ipv6_enabled and ansible_default_ipv6.address is defined
  and (nimbusel_public_ipv6 | length == 0) else []) }}

nimbusel_container_volumes:
  - "{{ nimbusel_datadir }}:/data"
  - "{{ nimbusel_auth_jwt_path }}:/execution-auth.jwt:ro"
nimbusel_container_security_opts: []
# nimbusel_container_memory:
# nimbusel_container_memory_reservation:
# nimbusel_container_memory_swap:
# nimbusel_container_memory_swappiness:
# nimbusel_container_kernel_memory:
# nimbusel_container_cpus:
# nimbusel_container_cpuset_cpus:
# nimbusel_container_cpuset_mems:
# nimbusel_container_cpu_shares:
# nimbusel_container_cpu_quota:
# nimbusel_container_cpu_period:
nimbusel_container_stop_timeout: "300"
nimbusel_container_networks: []
nimbusel_container_command_default:
  - executionClient
  - --log-level=INFO
  - --data-dir=/data
  - --net-key=/data/nodekey
  - --http-port={{ nimbusel_ports_http_rpc }}
  - --http-address=0.0.0.0
  - --rpc
  - --ws
  - --engine-api
  - --engine-api-address=0.0.0.0
  - --engine-api-port={{ nimbusel_ports_engine }}
  - --jwt-secret=/execution-auth.jwt
  - --metrics
  - --metrics-address=0.0.0.0
  - --metrics-port={{ nimbusel_ports_metrics }}
  - --nat=extip:{{ nimbusel_announced_ip }}
  - --tcp-port={{ nimbusel_ports_p2p }}

nimbusel_container_command_v6: []
  # - --nat=extip:{{ nimbusel_announced_ipv6 }} # not supported

nimbusel_container_command: >-
  {{
    nimbusel_container_command_default +
    (nimbusel_container_command_v6 if nimbusel_ipv6_enabled and ansible_default_ipv6.address is defined
    else [])
  }}

nimbusel_container_command_extra_args: []
#  - --rpc-api=eth,debug
#  - --http.vhosts=*
nimbusel_container_command_all: "{{ nimbusel_container_command + nimbusel_container_command_extra_args }}"

# Default image pull policy
nimbusel_container_pull: false

################################################################################
##
## upgradoor
##
################################################################################
nimbusel_upgradoor_enabled: "{{ upgradoor_enabled | default(false) }}"
nimbusel_upgradoor_team: nimbus
nimbusel_upgradoor_result: >-
  {{ nimbusel_upgradoor_deploy.stdout | from_json
     if (nimbusel_upgradoor_deploy.stdout | default('')) is match('{') else {} }}
nimbusel_upgradoor_deploy_argv: >-
  {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', nimbusel_container_name,
      '--image', nimbusel_container_image, '--command', nimbusel_container_command_all | to_json]
     + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
       | mandatory('upgradoor_deploy must be soft, force or immediate') }}
nimbusel_upgradoor_labels: >-
  {{ {'io.ethpandaops.upgradoor.kind': 'el'}
     | combine({'io.ethpandaops.upgradoor.team': nimbusel_upgradoor_team} if nimbusel_upgradoor_team else {})
     if nimbusel_upgradoor_enabled | bool else {} }}
nimbusel_upgradoor_comparisons: >-
  {{ {} if upgradoor_deploy | default('soft') == 'immediate'
     else dict(nimbusel_upgradoor_result.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
nimbusel_upgradoor_pull: >-
  {{ upgradoor_deploy | default('soft') == 'immediate'
     or (nimbusel_upgradoor_result.pull | default(nimbusel_container_pull | bool)) }}
