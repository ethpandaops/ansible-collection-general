- name: Add nimbusel user
  ansible.builtin.user:
    name: "{{ nimbusel_user }}"
  register: nimbusel_user_meta

- name: Create data dir
  ansible.builtin.file:
    path: "{{ nimbusel_datadir }}"
    state: directory
    mode: "0700"
    owner: "{{ nimbusel_user }}"
    group: "{{ nimbusel_user }}"

- name: Set permissions
  ansible.builtin.command: "chown -R {{ nimbusel_user }}:{{ nimbusel_user }} {{ nimbusel_datadir }}" # noqa no-free-form
  failed_when: false
  changed_when: false

- name: Deploy through upgradoor {{ nimbusel_container_name }}
  ansible.builtin.command:
    argv: >-
      {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', nimbusel_container_name,
          '--image', nimbusel_container_image, '--command',
          (nimbusel_container_command + nimbusel_container_command_extra_args) | to_json]
         + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
           | mandatory('upgradoor_deploy must be soft, force or immediate') }}
    removes: "{{ upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor') }}"
  register: nimbusel_upgradoor_deploy
  changed_when: nimbusel_upgradoor_deploy.stdout is match('{') and (nimbusel_upgradoor_deploy.stdout | from_json).changed
  when: nimbusel_upgradoor_enabled | bool

- name: Run nimbusel container
  vars:
    nimbusel_upgradoor: >-
      {{ nimbusel_upgradoor_deploy.stdout | from_json
         if nimbusel_upgradoor_deploy.stdout | default('') is match('{') else {} }}
  community.docker.docker_container:
    name: "{{ nimbusel_container_name }}"
    comparisons: >-
      {{ {} if upgradoor_deploy | default('soft') == 'immediate'
         else dict(nimbusel_upgradoor.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
    labels: >-
      {{ {'io.ethpandaops.upgradoor.kind': 'el'}
         | combine({'io.ethpandaops.upgradoor.team': nimbusel_upgradoor_team} if nimbusel_upgradoor_team else {})
         if nimbusel_upgradoor_enabled | bool else {} }}
    image: "{{ nimbusel_container_image }}"
    image_name_mismatch: recreate
    state: started
    restart_policy: always
    stop_timeout: "{{ nimbusel_container_stop_timeout }}"
    ports: "{{ nimbusel_container_ports }}"
    volumes: "{{ nimbusel_container_volumes }}"
    env: "{{ nimbusel_container_env }}"
    networks: "{{ nimbusel_container_networks }}"
    entrypoint: "{{ nimbusel_container_entrypoint | default(omit) }}"
    command: "{{ nimbusel_container_command + nimbusel_container_command_extra_args }}"
    user: "{{ nimbusel_user_meta.uid }}"
    pull: "{{ nimbusel_container_pull | bool }}"
    security_opts: "{{ nimbusel_container_security_opts }}"
    memory: "{{ nimbusel_container_memory | default(omit) }}"
    memory_reservation: "{{ nimbusel_container_memory_reservation | default(omit) }}"
    memory_swap: "{{ nimbusel_container_memory_swap | default(omit) }}"
    memory_swappiness: "{{ nimbusel_container_memory_swappiness | default(omit) }}"
    kernel_memory: "{{ nimbusel_container_kernel_memory | default(omit) }}"
    cpus: "{{ nimbusel_container_cpus | default(omit) }}"
    cpuset_cpus: "{{ nimbusel_container_cpuset_cpus | default(omit) }}"
    cpuset_mems: "{{ nimbusel_container_cpuset_mems | default(omit) }}"
    cpu_shares: "{{ nimbusel_container_cpu_shares | default(omit) }}"
    cpu_quota: "{{ nimbusel_container_cpu_quota | default(omit) }}"
    cpu_period: "{{ nimbusel_container_cpu_period | default(omit) }}"
