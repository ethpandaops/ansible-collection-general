ethereumjs_user: ethereumjs
ethereumjs_datadir: /data/ethereumjs
ethereumjs_auth_jwt_path: /data/execution-auth.secret
ethereumjs_announced_ip: "{{ ansible_host }}"
ethereumjs_public_ipv6: ""
ethereumjs_announced_ipv6: >-
  {{ ethereumjs_public_ipv6 if (ethereumjs_public_ipv6 | length > 0)
  else (ansible_default_ipv6.address
  if ethereumjs_ipv6_enabled and ansible_default_ipv6.address is defined else '') }}

ethereumjs_cleanup: false # when set to "true" it will remove the container

ethereumjs_ports_p2p: 30303
ethereumjs_ports_http_rpc: 8545
ethereumjs_ports_engine: 8551
ethereumjs_ports_metrics: 8000
ethereumjs_ipv6_enabled: false

ethereumjs_container_name: ethereumjs
ethereumjs_container_image: ethpandaops/ethereumjs:master
ethereumjs_container_env: {}
# ethereumjs_container_entrypoint:
ethereumjs_container_ports_ipv4:
  - "127.0.0.1:{{ ethereumjs_ports_http_rpc }}:{{ ethereumjs_ports_http_rpc }}"
  - "127.0.0.1:{{ ethereumjs_ports_engine }}:{{ ethereumjs_ports_engine }}"
  - "127.0.0.1:{{ ethereumjs_ports_metrics }}:{{ ethereumjs_ports_metrics }}"
  - "0.0.0.0:{{ ethereumjs_ports_p2p }}:{{ ethereumjs_ports_p2p }}"
  - "0.0.0.0:{{ ethereumjs_ports_p2p }}:{{ ethereumjs_ports_p2p }}/udp"

ethereumjs_container_ports_ipv6:
  - "[::]:{{ ethereumjs_ports_p2p }}:{{ ethereumjs_ports_p2p }}"
  - "[::]:{{ ethereumjs_ports_p2p }}:{{ ethereumjs_ports_p2p }}/udp"

ethereumjs_container_ports: >-
  {{ ethereumjs_container_ports_ipv4 +
  (ethereumjs_container_ports_ipv6
  if ethereumjs_ipv6_enabled and ansible_default_ipv6.address is defined
  and (ethereumjs_public_ipv6 | length == 0) else []) }}

ethereumjs_container_volumes:
  - "{{ ethereumjs_datadir }}:/data"
  - "{{ ethereumjs_auth_jwt_path }}:/execution-auth.jwt:ro"
ethereumjs_container_security_opts: []
# ethereumjs_container_memory:
# ethereumjs_container_memory_reservation:
# ethereumjs_container_memory_swap:
# ethereumjs_container_memory_swappiness:
# ethereumjs_container_kernel_memory:
# ethereumjs_container_cpus:
# ethereumjs_container_cpuset_cpus:
# ethereumjs_container_cpuset_mems:
# ethereumjs_container_cpu_shares:
# ethereumjs_container_cpu_quota:
# ethereumjs_container_cpu_period:
ethereumjs_container_stop_timeout: "300"
ethereumjs_container_networks: []
ethereumjs_container_command_default:
  - --dataDir=/data
  - --port={{ ethereumjs_ports_p2p }}
  - --rpc
  - --rpcAddr=0.0.0.0
  - --rpcPort={{ ethereumjs_ports_http_rpc }}
  - --rpcCors=*
  - --rpcEngine
  - --rpcEngineAddr=0.0.0.0
  - --rpcEnginePort={{ ethereumjs_ports_engine }}
  - --jwt-secret=/execution-auth.jwt
  - --extIP={{ ethereumjs_announced_ip }}
  - --prometheus
  - --prometheusPort={{ ethereumjs_ports_metrics }}

ethereumjs_container_command_v6: []
  # - --extIP={{ ethereumjs_announced_ipv6 }} # not supported

ethereumjs_container_command: >-
  {{ ethereumjs_container_command_default + (ethereumjs_container_command_v6 if ethereumjs_ipv6_enabled and ansible_default_ipv6.address is defined else []) }}

ethereumjs_container_command_extra_args: []
ethereumjs_container_command_all: "{{ ethereumjs_container_command + ethereumjs_container_command_extra_args }}"

# Default image pull policy
ethereumjs_container_pull: false

################################################################################
##
## upgradoor
##
################################################################################
ethereumjs_upgradoor_enabled: "{{ upgradoor_enabled | default(false) }}"
ethereumjs_upgradoor_team: ethereumjs
ethereumjs_upgradoor_result: >-
  {{ ethereumjs_upgradoor_deploy.stdout | from_json
     if (ethereumjs_upgradoor_deploy.stdout | default('')) is match('{') else {} }}
ethereumjs_upgradoor_deploy_argv: >-
  {{ [upgradoor_agent_binary_path | default('/usr/local/bin/upgradoor'), 'deploy', ethereumjs_container_name,
      '--image', ethereumjs_container_image, '--command', ethereumjs_container_command_all | to_json]
     + {'soft': [], 'force': ['--reset'], 'immediate': ['--reset']}[upgradoor_deploy | default('soft')]
       | mandatory('upgradoor_deploy must be soft, force or immediate') }}
ethereumjs_upgradoor_labels: >-
  {{ {'io.ethpandaops.upgradoor.kind': 'el'}
     | combine({'io.ethpandaops.upgradoor.team': ethereumjs_upgradoor_team} if ethereumjs_upgradoor_team else {})
     if ethereumjs_upgradoor_enabled | bool else {} }}
ethereumjs_upgradoor_comparisons: >-
  {{ {} if upgradoor_deploy | default('soft') == 'immediate'
     else dict(ethereumjs_upgradoor_result.ignore | default([]) | zip_longest([], fillvalue='ignore')) }}
ethereumjs_upgradoor_pull: >-
  {{ upgradoor_deploy | default('soft') == 'immediate'
     or (ethereumjs_upgradoor_result.pull | default(ethereumjs_container_pull | bool)) }}
